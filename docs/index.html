<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CsoundUnity documentation</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Documentation for CsoundUnity, the Csound wrapper for the Unity game engine.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="theme-simple-dark.css">
    <style>
        .sidebar-nav {
            --sidebar-nav-pagelink-background-image: none;
            --sidebar-nav-pagelink-background-image--loaded: none;
            --sidebar-nav-pagelink-background-image--active: none;
            --sidebar-nav-pagelink-background-image--collapse: none;
        }
        .sidebar-nav li {
            position: relative;
        }
        .sidebar-nav li:has(> a) {
            padding-left: 1.5rem;
        }
        .sidebar-nav li > a::before {
            content: none !important;
        }
        .sidebar-nav ul[data-sidebar-tree] {
            display: block;
        }
        .sidebar-nav ul[data-sidebar-tree][hidden] {
            display: none;
        }
        .sidebar-expand, .sidebar-group {
            border: 0;
            background: transparent;
            color: inherit;
            cursor: pointer;
            font: inherit;
        }
        .sidebar-expand {
            position: absolute;
            left: 0;
            top: 0;
            width: 1.5rem;
            min-height: 2rem;
            padding: 0;
            line-height: inherit;
        }
        .sidebar-expand::before, .sidebar-group::before {
            content: '▸';
            display: inline-block;
            width: 1.5rem;
            color: var(--theme-color);
        }
        .sidebar-expand[aria-expanded="true"]::before,
        .sidebar-group[aria-expanded="true"]::before {
            content: '▾';
        }
        .sidebar-group {
            display: block;
            width: 100%;
            padding: 0;
            text-align: left;
            font-weight: bold;
        }
        .sidebar-expand:focus-visible, .sidebar-group:focus-visible {
            outline: 2px solid var(--theme-color);
            outline-offset: 2px;
        }
        @media (max-width: 47.99em) {
            :root {
                --sidebar-width: min(24rem, calc(100vw - 3rem));
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script src="spotlights.js"></script>
    <script src="sidebar.js"></script>
    <script>
        window.$docsify = {
            name: 'CsoundUnity v4',
            homepage: 'index.md',
            nameLink: '/CsoundUnity/',
            repo: 'https://github.com/rorywalsh/CsoundUnity',
            auto2top: true,
            loadSidebar: true,
            subMaxLevel: 0,
            plugins: [window.csoundUnitySpotlights, window.csoundUnitySidebar]
        }
    </script>
    <!-- Docsify v4 -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>

</html>
