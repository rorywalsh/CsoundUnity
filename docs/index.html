<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CsoundUnity documentation</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Documentation for CsoundUnity, the Csound wrapper for the Unity game engine.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="theme-simple-dark.css">
</head>

<body>
    <div id="app"></div>
    <script>
        window.$docsify = {
            name: 'CsoundUnity v4',
            nameLink: '/CsoundUnity/',
            repo: 'https://github.com/rorywalsh/CsoundUnity',
            auto2top: true,
            loadSidebar: true,
            plugins: [
                // Docsify scrolls to a ?id= when the link is followed inside the site, and stays at
                // the top when the page is opened on that link from somewhere else.
                function (hook) {
                    hook.doneEach(function () {
                        var wanted = location.hash.match(/[?&]id=([^&]+)/);
                        if (!wanted) return;

                        var section = document.getElementById(decodeURIComponent(wanted[1]));
                        if (!section) return;

                        var go = function () { section.scrollIntoView(); };

                        // Before the load event the browser still has the last scroll position to
                        // restore, and restoring it undoes this.
                        if (document.readyState === 'complete') go();
                        else window.addEventListener('load', go, { once: true });
                    });
                }
            ]
        }
    </script>
    <!-- Docsify v4 -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>

</html>
